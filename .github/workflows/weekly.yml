name: Weekly surveillance update

# CDC publishes new NHSN admissions to the hubs each week (Wednesday-Friday).
# This job pulls them, re-runs detection and forecasts, and publishes the bulletin and dashboard.
on:
  schedule:
    - cron: "23 14 * * 5"   # Fridays 14:23 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements-dev.txt
      - name: Refresh data, detect, forecast
        run: make refresh report dashboard
      - name: Verify
        run: make test
      - name: Publish bulletin and dashboard
        run: |
          if git diff --quiet -- reports/ docs/; then
            echo "No new data this week."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/ docs/
          git commit -m "Surveillance update $(date -u +%Y-%m-%d)"
          git push
